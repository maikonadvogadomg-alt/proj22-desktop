<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Code Studio - Atualizado</title>
  <style>
    /* ============================================================
   MÓDULO: BASE / VARIÁVEIS
   ============================================================ */
    :root {
      --bg: #0d1117;
      --bg2: #161b22;
      --bg3: #21262d;
      --border: #30363d;
      --text: #c9d1d9;
      --text2: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
      --purple: #bc8cff;
      --orange: #f0883e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ============================================================
   MÓDULO: HEADER
   ============================================================ */
    .header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .header h1 {
      font-size: 15px;
      color: var(--accent);
      font-weight: 700;
      white-space: nowrap;
    }

    .header-controls {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      flex: 1;
    }

    /* ============================================================
   MÓDULO: COMPONENTES BASE (btn, select, input)
   ============================================================ */
    select,
    input[type="text"],
    input[type="password"],
    input[type="number"] {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: var(--accent);
    }

    .btn {
      padding: 5px 11px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--border);
    }

    .btn.primary {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .btn.primary:hover {
      opacity: 0.85;
    }

    .btn.danger {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
    }

    .btn.success {
      background: var(--green);
      color: #000;
      border-color: var(--green);
    }

    .btn.warn {
      background: var(--yellow);
      color: #000;
      border-color: var(--yellow);
    }

    .btn.purple {
      background: var(--purple);
      color: #000;
      border-color: var(--purple);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ============================================================
   MÓDULO: LAYOUT PRINCIPAL
   ============================================================ */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ============================================================
   MÓDULO: SIDEBAR (conversas)
   ============================================================ */
    .sidebar {
      width: 210px;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.2s;
    }

    .sidebar.collapsed {
      width: 0;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .conversations {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }

    .conv-item {
      padding: 7px 9px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      margin-bottom: 3px;
      border: 1px solid transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
    }

    .conv-item:hover {
      background: var(--bg3);
    }

    .conv-item.active {
      background: var(--bg3);
      border-color: var(--accent);
    }

    .conv-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }

    .conv-meta {
      font-size: 10px;
      color: var(--text2);
    }

    .conv-delete {
      color: var(--red);
      cursor: pointer;
      font-size: 13px;
      opacity: 0;
      flex-shrink: 0;
    }

    .conv-item:hover .conv-delete {
      opacity: 1;
    }

    /* ============================================================
   MÓDULO: ÁREA DE CHAT
   ============================================================ */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-toolbar {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 6px 12px;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .conv-title-edit {
      font-size: 13px;
      font-weight: 600;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      border-radius: 4px;
      padding: 2px 6px;
      cursor: pointer;
    }

    .conv-title-edit:hover {
      border-color: var(--border);
    }

    .conv-title-edit:focus {
      border-color: var(--accent);
      outline: none;
      background: var(--bg3);
    }

    .context-info {
      font-size: 11px;
      color: var(--text2);
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .context-bar {
      width: 80px;
      height: 5px;
      background: var(--bg3);
      border-radius: 3px;
      overflow: hidden;
    }

    .context-fill {
      height: 100%;
      background: var(--green);
      transition: width 0.3s, background 0.3s;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      display: flex;
      gap: 8px;
      max-width: 100%;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .message.user .avatar {
      background: var(--accent);
      color: #000;
    }

    .message.ai .avatar {
      background: var(--purple);
      color: #000;
    }

    .message.system-msg .avatar {
      background: var(--yellow);
      color: #000;
    }

    .message.memory-msg .avatar {
      background: var(--orange);
      color: #000;
    }

    .bubble {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 13px;
      max-width: 82%;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-word;
    }

    .message.user .bubble {
      background: var(--bg3);
      border-color: var(--accent);
    }

    .message.memory-msg .bubble {
      background: var(--bg3);
      border-color: var(--orange);
      font-size: 12px;
    }

    .bubble pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      overflow-x: auto;
      margin: 7px 0;
      position: relative;
    }

    .bubble code {
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 12px;
    }

    .copy-code-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      padding: 2px 7px;
      font-size: 11px;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      cursor: pointer;
    }

    .copy-code-btn:hover {
      background: var(--accent);
      color: #000;
    }

    .msg-time {
      font-size: 10px;
      color: var(--text2);
      margin-top: 4px;
      text-align: right;
    }

    /* ============================================================
   MÓDULO: INPUT AREA
   ============================================================ */
    .input-area {
      background: var(--bg2);
      border-top: 1px solid var(--border);
      padding: 10px 12px;
    }

    .input-options {
      display: flex;
      gap: 10px;
      margin-bottom: 7px;
      flex-wrap: wrap;
      align-items: center;
    }

    .input-options label {
      font-size: 12px;
      color: var(--text2);
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .input-row {
      display: flex;
      gap: 7px;
      align-items: flex-end;
    }

    .input-box {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 11px;
      border-radius: 8px;
      font-size: 13px;
      resize: none;
      outline: none;
      min-height: 42px;
      max-height: 180px;
      font-family: inherit;
      line-height: 1.5;
    }

    .input-box:focus {
      border-color: var(--accent);
    }

    /* ============================================================
   MÓDULO: PAINEL DE CÓDIGO
   ============================================================ */
    .code-panel {
      width: 400px;
      background: var(--bg2);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.2s;
    }

    .code-panel.collapsed {
      width: 0;
      overflow: hidden;
    }

    .code-panel-header {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .code-panel-header h3 {
      font-size: 12px;
      color: var(--text2);
    }

    .code-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      overflow-x: auto;
      min-height: 32px;
    }

    .code-tab {
      padding: 6px 12px;
      font-size: 11px;
      cursor: pointer;
      border-right: 1px solid var(--border);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--text2);
    }

    .code-tab:hover {
      background: var(--bg3);
      color: var(--text);
    }

    .code-tab.active {
      background: var(--bg2);
      color: var(--accent);
      border-bottom: 2px solid var(--accent);
    }

    .code-tab-close {
      opacity: 0;
      color: var(--red);
      font-size: 13px;
    }

    .code-tab:hover .code-tab-close {
      opacity: 1;
    }

    .code-editor-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .code-editor {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: none;
      padding: 10px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 12px;
      resize: none;
      outline: none;
      line-height: 1.6;
      tab-size: 2;
    }

    .code-actions {
      padding: 7px 10px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* ============================================================
   MÓDULO: PAINEL CÉREBRO (memória)
   ============================================================ */
    .brain-panel {
      width: 0;
      background: var(--bg2);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.25s;
    }

    .brain-panel.open {
      width: 300px;
    }

    .brain-header {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brain-header h3 {
      font-size: 13px;
      color: var(--orange);
    }

    .brain-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .memory-item {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      margin-bottom: 8px;
      font-size: 12px;
      line-height: 1.5;
      position: relative;
    }

    .memory-item:hover {
      border-color: var(--orange);
    }

    .memory-item .mem-time {
      font-size: 10px;
      color: var(--text2);
      margin-top: 4px;
    }

    .memory-item .mem-del {
      position: absolute;
      top: 6px;
      right: 8px;
      color: var(--red);
      cursor: pointer;
      font-size: 13px;
      opacity: 0;
    }

    .memory-item:hover .mem-del {
      opacity: 1;
    }

    .memory-tag {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 10px;
      font-size: 10px;
      margin-right: 4px;
      margin-bottom: 3px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text2);
    }

    .memory-tag.code {
      border-color: var(--accent);
      color: var(--accent);
    }

    .memory-tag.context {
      border-color: var(--orange);
      color: var(--orange);
    }

    .memory-tag.important {
      border-color: var(--red);
      color: var(--red);
    }

    .brain-actions {
      padding: 8px 10px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* ============================================================
   MÓDULO: MODAIS
   ============================================================ */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
      width: 520px;
      max-width: 95vw;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      font-size: 16px;
      margin-bottom: 18px;
      color: var(--accent);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text2);
      margin-bottom: 5px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 7px 10px;
    }

    .form-group textarea {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      resize: vertical;
      min-height: 70px;
      font-family: inherit;
    }

    .range-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .range-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }

    .range-val {
      min-width: 45px;
      text-align: right;
      font-size: 12px;
      color: var(--accent);
    }

    .api-row {
      display: flex;
      gap: 6px;
    }

    .api-row input {
      flex: 1;
    }

    .modal-footer {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .section-title {
      font-size: 11px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 14px 0 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }

    /* ============================================================
   MÓDULO: TOAST
   ============================================================ */
    .toast {
      position: fixed;
      bottom: 18px;
      right: 18px;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 15px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 9999;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.25s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.success {
      border-color: var(--green);
      color: var(--green);
    }

    .toast.error {
      border-color: var(--red);
      color: var(--red);
    }

    .toast.warn {
      border-color: var(--yellow);
      color: var(--yellow);
    }

    /* ============================================================
   MÓDULO: LOADING / TYPING
   ============================================================ */
    .typing {
      display: flex;
      gap: 4px;
      padding: 3px 0;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: var(--text2);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .2s;
    }

    .typing span:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: translateY(0);
        opacity: .4;
      }

      40% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    /* ============================================================
   MÓDULO: SCROLLBAR
   ============================================================ */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text2);
    }

    .hidden {
      display: none !important;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 10px 0;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🤖 AI Code Studio</h1>
    <div class="header-controls">
      <select id="aiProvider" onchange="MODULE_Provider.onChange()">
            <option value="openai">OpenAI (GPT)</option>
            <option value="anthropic">Anthropic (Claude)</option>
            <option value="gemini">Google (Gemini)</option>
            <option value="groq">Groq (Llama)</option>
            <option value="openrouter">OpenRouter (Multi)</option>
            <option value="ollama">Ollama (Local)</option>
        </select>
      <select id="modelSelect" style="min-width:150px"></select>
      <button class="btn" onclick="MODULE_Settings.open()">⚙️ Config</button>
      <button class="btn warn" onclick="MODULE_Brain.toggle()">🧠 Cérebro</button>
      <button class="btn primary" onclick="MODULE_Chat.confirmNewChat()">＋ Novo Chat</button>
      <button class="btn" onclick="MODULE_Code.togglePanel()">💻 Código</button>
      <button class="btn" onclick="MODULE_Storage.exportAll()">💾 Exportar</button>
      <button class="btn" onclick="MODULE_Storage.importBackup()">📂 Importar</button>
    </div>
  </div>

  <div class="main">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        Conversas
        <button class="btn" style="padding:1px 7px;font-size:11px" onclick="MODULE_Chat.confirmNewChat()">+</button>
      </div>
      <div class="conversations" id="convList"></div>
    </div>

    <div class="chat-area">
      <div class="chat-toolbar">
        <input class="conv-title-edit" id="convTitleEdit" value="Nova Conversa" onblur="MODULE_Chat.renameConv(this.value)" onkeydown="if(event.key==='Enter')this.blur()">
        <div class="context-info">
          <span id="tokenCount">0</span>tk
          <div class="context-bar">
            <div class="context-fill" id="contextFill" style="width: 0%;"></div>
          </div>
          <button class="btn" style="padding:2px 7px;font-size:11px" onclick="MODULE_Context.clear()" title="Limpar contexto">✂️</button>
          <button class="btn" style="padding:2px 7px;font-size:11px" onclick="MODULE_Context.summarize()" title="Resumir contexto">📋</button>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="input-area">
        <div class="input-options">
          <label>
                    <input type="checkbox" id="webSearchCheck">
                    🌐 Web
                </label>
          <label>
                    <input type="checkbox" id="codeMode" checked>
                    💻 Código
                </label>
          <label>
                    🌡️
                    <input type="range" min="0" max="2" step="0.1" value="0.7" id="tempSlider" style="width:70px;accent-color:var(--accent);vertical-align:middle" oninput="document.getElementById('tempVal').textContent=this.value">
                    <span id="tempVal">0.7</span>
                </label>
          <label>
                    📏
                    <input type="number" id="maxTokens" value="4096" min="256" max="32000" style="width:75px">
                </label>
        </div>
        <div class="input-row">
          <textarea class="input-box" id="userInput" placeholder="Mensagem... (Ctrl+Enter envia)" onkeydown="MODULE_UI.handleKey(event)" oninput="MODULE_UI.autoResize(this)"></textarea>
          <button class="btn" onclick="MODULE_Code.pasteToEditor()" title="Colar código">📋</button>
          <button class="btn primary" onclick="MODULE_Chat.send()" id="sendBtn">Enviar ▶</button>
        </div>
      </div>
    </div>

    <div class="code-panel collapsed" id="codePanel">
      <div class="code-panel-header">
        <h3>💻 Editor</h3>
        <button class="btn" onclick="MODULE_Code.newTab()">+ Tab</button>
        <button class="btn" onclick="MODULE_Code.importFile()">📂</button>
        <button class="btn" onclick="MODULE_Code.togglePanel()" style="margin-left:auto">✕</button>
      </div>
      <div class="code-tabs" id="codeTabs"></div>
      <div class="code-editor-wrap">
        <textarea class="code-editor" id="codeEditor" spellcheck="false" placeholder="// Cole ou escreva código aqui..."></textarea>
      </div>
      <div class="code-actions">
        <button class="btn success" onclick="MODULE_Code.copyClean()">📋 Copiar</button>
        <button class="btn" onclick="MODULE_Code.sendToChat()">💬 Chat</button>
        <button class="btn" onclick="MODULE_Code.download()">⬇️</button>

    <div class="brain-panel" id="brainPanel">
      <div class="brain-header">

  <div class="modal-overlay" id="settingsModal">
    <div class="modal">

        <label>Anthropic (Claude) Key</label>
        <div class="api-row">
          <input type="password" id="anthropicKeyInput" placeholder="sk-ant-...">
          <button class="btn" onclick="MODULE_UI.togglePass('anthropicKeyInput')">👁️</button>
        </div>
      </div>
      <div class="form-group">
        <label>Google Gemini Key (Compatível com AIza... ou AQ...)</label>
        <div class="api-row">
          <input type="password" id="geminiKeyInput" placeholder="AQ. ou AIza...">
          <button class="btn" onclick="MODULE_UI.togglePass('geminiKeyInput')">👁️</button>
        </div>

      <div class="form-group">
        <label>🌐 Serper Key (Web Search)</label>
        <div class="api-row">
          <input type="password" id="serperKeyInput" placeholder="Serper.dev key">

1. Use blocos de código com linguagem especificada

  <div class="modal-overlay new-chat-modal" id="newChatModal">
    <div class="modal">
      <h2>＋ Novo Chat</h2>

        um novo chat?</p>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="btn success" onclick="MODULE_Chat.newChatAction('save')">💾 Salvar conversa atual e iniciar novo chat</button>
        <button class="btn warn" onclick="MODULE_Chat.newChatAction('memory')">🧠 Salvar como memória e iniciar novo chat</button>
        <button class="btn primary" onclick="MODULE_Chat.newChatAction('both')">✅ Salvar conversa + criar memória</button>
        <button class="btn danger" onclick="MODULE_Chat.newChatAction('discard')">🗑️ Descartar e iniciar novo chat</button>
        <button class="btn" onclick="MODULE_Chat.closeNewChatModal()">✕ Cancelar</button>

  <div class="modal-overlay" id="memoryModal">
    <div class="modal">

      <div class="form-group">

      </div>
      <div class="modal-footer">
        <button class="btn" onclick="MODULE_Brain.closeMemoryModal()">Cancelar</button>
        <button class="btn primary" onclick="MODULE_Brain.saveManual()">💾 Salvar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">💾 Auto-saved</div>

  <input type="file" id="fileImportCode" style="display:none" accept=".js,.py,.html,.css,.ts,.java,.cs,.cpp,.php,.sql,.txt,.json,.md,.rs,.go,.sh" onchange="MODULE_Code.handleFileImport(event)">
  <input type="file" id="fileImportBackup" style="display:none" accept=".json" onchange="MODULE_Storage.handleImport(event)">
  <input type="file" id="fileImportMemory" style="display:none" accept=".json" onchange="MODULE_Brain.handleImport(event)">

  <script>
    'use strict';

const STATE = {
    conversations: {},
    activeConvId: null,
    codeTabs: [],
    activeCodeTab: 0,
    memories: [],
    settings: {
        apiKey: '', anthropicKey: '', geminiKey: '', serperKey: '',
        ollamaUrl: 'http://localhost:11434', contextLimit: 8000,
        contextStrategy: 'trim', systemPrompt: '', autoSaveInterval: 30,
        provider: 'gemini', model: 'gemini-2.5-flash', temperature: 0.7, maxTokens: 4096,
        memoryInjectCount: 5, autoMemory: '1'
    },
    isLoading: false,
    _autoSaveTimer: null,
    _version: '1.1.0'
};

const MODULE_Provider = (() => {
    const MODELS = {
        openai:      ['gpt-4o','gpt-4o-mini','gpt-4-turbo'],
        anthropic:   ['claude-3-5-sonnet-20241022','claude-3-haiku-20240307'],
        gemini:      ['gemini-2.5-flash', 'gemini-1.5-pro', 'gemini-1.5-flash'],
        groq:        ['llama-3.3-70b-versatile','llama-3.1-8b-instant'],
        openrouter:  ['openai/gpt-4o','anthropic/claude-3.5-sonnet','google/gemini-pro-1.5'],
        ollama:      ['llama3.2','codellama','mistral']
    };

    function onChange() { updateSelect(); }

    function updateSelect() {
        const provider = document.getElementById('aiProvider').value;
        const sel = document.getElementById('modelSelect');
        const models = MODELS[provider] || [];
        sel.innerHTML = models.map(m => `<option value="${m}">${m}</option>`).join('');
        if (STATE.settings.provider === provider && STATE.settings.model) {
            if (models.includes(STATE.settings.model)) sel.value = STATE.settings.model;
        }
    }

    function current() {
        return {
            provider: document.getElementById('aiProvider').value,
            model:    document.getElementById('modelSelect').value
        };
    }

    return { onChange, updateSelect, current, MODELS };
})();

const MODULE_Storage = (() => {
    const KEY = 'aiStudio_v2';
    function save() {
        try {
            localStorage.setItem(KEY, JSON.stringify({
                conversations: STATE.conversations, activeConvId: STATE.activeConvId,
                codeTabs: STATE.codeTabs, activeCodeTab: STATE.activeCodeTab,
                memories: STATE.memories, settings: STATE.settings, _version: STATE._version
            }));
        } catch(e) {}
    }
    function load() {
        try {
            const raw = localStorage.getItem(KEY);
            if (!raw) return;
            const d = JSON.parse(raw);
            STATE.conversations = d.conversations || {};
            STATE.activeConvId = d.activeConvId || null;
            STATE.codeTabs = d.codeTabs || [];
            STATE.activeCodeTab = d.activeCodeTab || 0;
            STATE.memories = d.memories || [];
            if (d.settings) STATE.settings = { ...STATE.settings, ...d.settings };
        } catch(e) {}
    }
    function setupAutoSave() {
        if (STATE._autoSaveTimer) clearInterval(STATE._autoSaveTimer);
        const sec = parseInt(STATE.settings.autoSaveInterval) || 0;
        if (sec > 0) {
            STATE._autoSaveTimer = setInterval(() => { save(); MODULE_UI.toast('💾 Auto-saved', 'success'); }, sec * 1000);
        }
    }
    function exportAll() {
        const data = { conversations: STATE.conversations, codeTabs: STATE.codeTabs, memories: STATE.memories, settings: STATE.settings };
        _download(JSON.stringify(data, null, 2), `ai-studio-backup-${Date.now()}.json`, 'application/json');
    }
    function importBackup() { document.getElementById('fileImportBackup').click(); }
    function handleImport(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const d = JSON.parse(ev.target.result);
                if (d.conversations) STATE.conversations = { ...STATE.conversations, ...d.conversations };
                save();
                MODULE_Chat.renderConversations();
                MODULE_UI.toast('✅ Backup importado!', 'success');
            } catch(err) { MODULE_UI.toast('❌ Erro', 'error'); }
        };
        reader.readAsText(file);
    }
    function _download(content, filename, type) {
        const blob = new Blob([content], { type });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
    }
    return { save, load, setupAutoSave, exportAll, importBackup, handleImport, _download };
})();

const MODULE_Brain = (() => {
    function toggle() { document.getElementById('brainPanel').classList.toggle('open'); if (document.getElementById('brainPanel').classList.contains('open')) render(); }
    function render() {
        const container = document.getElementById('brainContent');
        if (!STATE.memories.length) { container.innerHTML = '<p style="font-size:12px;color:var(--text2);text-align:center;padding:20px">Nenhuma memória salva.</p>'; return; }
        container.innerHTML = STATE.memories.map(m => `
            <div class="memory-item">
                <span class="mem-del" onclick="MODULE_Brain.deleteMemory('${m.id}')">✕</span>
                <div><span class="memory-tag">${m.type}</span></div>
                <div style="margin-top:5px">${escapeHtml(m.content)}</div>
            </div>
        `).join('');
    }
    function addManual() { document.getElementById('memoryContent').value = ''; document.getElementById('memoryModal').classList.add('open'); }
    function closeMemoryModal() { document.getElementById('memoryModal').classList.remove('open'); }
    function saveManual() {
        const content = document.getElementById('memoryContent').value.trim();
        if (!content) return;
        STATE.memories.unshift({ id: 'mem_' + Date.now(), content, type: 'context', createdAt: Date.now() });
        MODULE_Storage.save(); closeMemoryModal(); render();
        MODULE_UI.toast('🧠 Memória salva!', 'success');
    }
    function deleteMemory(id) { STATE.memories = STATE.memories.filter(m => m.id !== id); MODULE_Storage.save(); render(); }
    function clearAll() { STATE.memories = []; MODULE_Storage.save(); render(); }
    function getContextBlock() {
        if (!STATE.memories.length) return '';
        return `\n\n🧠 MEMÓRIAS:\n` + STATE.memories.slice(0, 3).map(m => m.content).join('\n---\n');
    }
    return { toggle, render, addManual, closeMemoryModal, saveManual, deleteMemory, clearAll, getContextBlock, exportMemory: () => {}, importMemory: () => {}, handleImport: () => {} };
})();

const MODULE_Chat = (() => {
    function confirmNewChat() { _createNew(); }
    function closeNewChatModal() { document.getElementById('newChatModal').classList.remove('open'); }
    function newChatAction(action) { closeNewChatModal(); _createNew(); }
    function _createNew() {
        const id = 'conv_' + Date.now();
        STATE.conversations[id] = { id, title: 'Nova Conversa', messages: [], createdAt: Date.now() };
        STATE.activeConvId = id;
        MODULE_Storage.save();
        renderConversations();
        _loadConv(id);
    }
    function _loadConv(id) {
        STATE.activeConvId = id;
        const conv = STATE.conversations[id];
        if (!conv) return;
        document.getElementById('convTitleEdit').value = conv.title;
        renderMessages(conv.messages);
        MODULE_Context.updateBar(conv.messages);
        renderConversations();
    }
    function renameConv(title) {
        const conv = STATE.conversations[STATE.activeConvId];
        if (!conv || !title.trim()) return;
        conv.title = title.trim();
        renderConversations();
        MODULE_Storage.save();
    }
    function deleteConv(id, e) {
        e.stopPropagation();
        delete STATE.conversations[id];
        if (STATE.activeConvId === id) {
            const keys = Object.keys(STATE.conversations);
            if (keys.length > 0) _loadConv(keys[keys.length - 1]); else _createNew();
        }
        MODULE_Storage.save();
        renderConversations();
    }
    function renderConversations() {
        const list = document.getElementById('convList');
        list.innerHTML = Object.values(STATE.conversations).map(conv => `
            <div class="conv-item ${conv.id === STATE.activeConvId ? 'active' : ''}" onclick="MODULE_Chat._loadConv('${conv.id}')">
                <div class="conv-title">${escapeHtml(conv.title)}</div>
                <span class="conv-delete" onclick="MODULE_Chat.deleteConv('${conv.id}',event)">✕</span>
            </div>
        `).join('');
    }
    function renderMessages(messages) {
        const container = document.getElementById('messages');
        container.innerHTML = (messages || []).map(msg => `
            <div class="message ${msg.role === 'user' ? 'user' : 'ai'}">
                <div class="avatar">${msg.role === 'user' ? '👤' : '🤖'}</div>
                <div class="bubble">${formatMessage(msg.content)}</div>
            </div>
        `).join('');
        container.scrollTop = container.scrollHeight;
    }
    async function send() {
        if (STATE.isLoading) return;
        const input = document.getElementById('userInput');
        let text = input.value.trim();
        if (!text) return;

        const conv = STATE.conversations[STATE.activeConvId];
        if (!conv) { _createNew(); return; }

        conv.messages.push({ role: 'user', content: text, timestamp: Date.now() });
        renderMessages(conv.messages);
        input.value = '';
        MODULE_UI.autoResize(input);

        STATE.isLoading = true;
        document.getElementById('sendBtn').disabled = true;

        try {
            const reply = await MODULE_AI.call(conv.messages);
            conv.messages.push({ role: 'assistant', content: reply, timestamp: Date.now() });
            renderMessages(conv.messages);
            MODULE_Storage.save();
        } catch(err) {
            MODULE_UI.toast('❌ ' + err.message, 'error');
        }
        STATE.isLoading = false;
        document.getElementById('sendBtn').disabled = false;
    }
    return { confirmNewChat, closeNewChatModal, newChatAction, renameConv, deleteConv, renderConversations, renderMessages, send, _loadConv };
})();

const MODULE_Context = (() => {
    function updateBar(messages) {
        const tokens = Math.ceil((messages || []).reduce((a, m) => a + (m.content?.length || 0), 0) / 4);
        document.getElementById('tokenCount').textContent = tokens;
        document.getElementById('contextFill').style.width = Math.min(100, (tokens / 8000) * 100) + '%';
    }
    function clear() {
        const conv = STATE.conversations[STATE.activeConvId];
        if (!conv) return;
        conv.messages = [];
        MODULE_Chat.renderMessages([]);
        updateBar([]);
    }
    function summarize() {}
    return { updateBar, clear, summarize };
})();

const MODULE_AI = (() => {
    async function call(messages) {
        const { provider, model } = MODULE_Provider.current();
        const s = STATE.settings;
        const temp = parseFloat(document.getElementById('tempSlider').value);
        const maxT = parseInt(document.getElementById('maxTokens').value);

        switch (provider) {
            case 'gemini': return await _gemini(messages, model, s.geminiKey, temp, maxT);
            case 'openai': return await _openai(messages, model, s.apiKey, temp, maxT);
            default: throw new Error('Selecione o Gemini ou configure a API Key correta');
        }
    }

    async function _gemini(messages, model, apiKey, temp, maxTokens) {
        if (!apiKey) throw new Error('Insira a chave do Gemini (AQ... ou AIza...) nas Configurações!');
        
        const contents = messages.map(m => ({
            role: m.role === 'assistant' ? 'model' : 'user',
            parts: [{ text: m.content }]
        }));

        // Passa a chave por parâmetro na URL para garantir compatibilidade com as chaves AQ.
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents,
                generationConfig: { temperature: temp, maxOutputTokens: maxTokens }
            })
        });

        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.error?.message || `Gemini HTTP ${res.status}`);
        }

        const data = await res.json();
        return data.candidates[0].content.parts[0].text;
    }

    async function _openai(messages, model, apiKey, temp, maxTokens) {
        if (!apiKey) throw new Error('API Key OpenAI não configurada');
        const res = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
            body: JSON.stringify({ model, messages, temperature: temp, max_tokens: maxTokens })
        });
        const data = await res.json();
        return data.choices[0].message.content;
    }

    return { call };
})();

const MODULE_Code = (() => {
    function togglePanel() { document.getElementById('codePanel').classList.toggle('collapsed'); }
    function newTab(name = null) {
        STATE.codeTabs.push({ id: 'tab_' + Date.now(), name: name || `código_${STATE.codeTabs.length + 1}`, content: '', language: 'javascript' });
        STATE.activeCodeTab = STATE.codeTabs.length - 1;
        renderTabs();
    }
    function renderTabs() {
        document.getElementById('codeTabs').innerHTML = STATE.codeTabs.map((tab, i) => `
            <div class="code-tab ${i === STATE.activeCodeTab ? 'active' : ''}">
                <span onclick="MODULE_Code.switchTab(${i})">${escapeHtml(tab.name)}</span>
            </div>
        `).join('');
    }
    function switchTab(i) { STATE.activeCodeTab = i; renderTabs(); }
    return { togglePanel, newTab, renderTabs, switchTab, copyClean: () => {}, sendToChat: () => {}, clear: () => {}, download: () => {}, pasteToEditor: () => {}, importFile: () => {} };
})();

const MODULE_Settings = (() => {
    function open() {
        document.getElementById('geminiKeyInput').value = STATE.settings.geminiKey || '';
        document.getElementById('apiKeyInput').value = STATE.settings.apiKey || '';
        document.getElementById('settingsModal').classList.add('open');
    }
    function close() { document.getElementById('settingsModal').classList.remove('open'); }
    function save() {
        STATE.settings.geminiKey = document.getElementById('geminiKeyInput').value.trim();
        STATE.settings.apiKey = document.getElementById('apiKeyInput').value.trim();
        STATE.settings.provider = document.getElementById('aiProvider').value;
        STATE.settings.model = document.getElementById('modelSelect').value;
        MODULE_Storage.save();
        close();
        MODULE_UI.toast('✅ Configurações salvas!', 'success');
    }
    return { open, close, save };
})();

const MODULE_UI = (() => {
    function toast(msg, type = '') {
        const el = document.getElementById('toast');
        el.textContent = msg; el.className = `toast show ${type}`;
        setTimeout(() => { el.className = 'toast'; }, 3000);
    }
    function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 180) + 'px'; }
    function handleKey(e) { if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); MODULE_Chat.send(); } }
    function togglePass(id) { const el = document.getElementById(id); el.type = el.type === 'password' ? 'text' : 'password'; }
    return { toast, autoResize, handleKey, togglePass };
})();

function escapeHtml(text) {
    return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatMessage(text) {
    text = String(text);
    text = text.replace(/```(\w+)?\n?([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${escapeHtml(code.trim())}</code></pre>`);
    text = text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
    return text.replace(/\n/g,'<br>');
}

function INIT() {
    MODULE_Storage.load();
    if (STATE.settings.provider) document.getElementById('aiProvider').value = STATE.settings.provider;
    MODULE_Provider.updateSelect();
    MODULE_Chat.renderConversations();
    MODULE_Brain.render();
    if (Object.keys(STATE.conversations).length === 0) {
        MODULE_Chat.confirmNewChat();
    } else {
        MODULE_Chat._loadConv(STATE.activeConvId || Object.keys(STATE.conversations)[0]);
    }
    if (STATE.codeTabs.length === 0) MODULE_Code.newTab();
    MODULE_Storage.setupAutoSave();
    MODULE_UI.toast('🚀 AI Code Studio pronto!', 'success');
}

INIT();
  </script>
